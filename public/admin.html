/* Açılış animasiyası (splash): yalnız bu cihazda giriş yadda qalıbsa göstərilir */
#qs-splash{display:none;--qs-bg:#fff;--qs-fg:#000}
html.qs-splash #qs-splash{display:grid;position:fixed;inset:0;z-index:9999;place-items:center;background:var(--qs-bg);transition:opacity .45s ease}
#qs-splash.out{opacity:0;pointer-events:none}
#qs-splash svg{width:min(34vw,150px);height:auto;fill:var(--qs-fg);overflow:visible}
#qs-splash .mc{transform-box:fill-box;transform-origin:center;animation:qsc .5s cubic-bezier(.2,.8,.2,1) both}
#qs-splash .sp{transform-box:fill-box;transform-origin:50% 0;animation:qss .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.4s + var(--i)*.15s)}
@keyframes qsc{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes qss{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){#qs-splash .mc,#qs-splash .sp{animation:none}}

 if(r.error)console.warn(r.error.message);return !r.error}};

 bs(t){S.D.bs=t.dataset.v;if(S.D.bs!=="grad")S.D.gp=-1;push();render()},gm(t){S.D.gp=t.dataset.v==="p"?0:-1;push();render()},gp(t){S.D.gp=+t.dataset.i;push();render()},
 undo(){if(hi>0){S.D=JSON.parse(H[--hi]);render()}},redo(){if(hi<H.length-1){S.D=JSON.parse(H[++hi]);render()}},
 cancel(){S.D=JSON.parse(SV);H=[SV];hi=0;render()},async save(){SV=JSON.stringify(S.D);toast((await QG.save(S))?"Yadda saxlandı ✓":"Saxlanmadı, yenidən cəhd et")}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;if((a==="close"||a==="ovx")&&e.target!==t)return;if(A[a])A[a](t)});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
 if(d.d){if(d.hex!==undefined&&!/^#[0-9a-f]{6}$/i.test(t.value))return;S.D[d.d]=t.value;document.querySelectorAll(`[data-d="${d.d}"]`).forEach(x=>{if(x!==t)x.value=t.value});push();upd()}
 else if(d.f){S[d.f]=t.value;const c=document.querySelector(`[data-cnt="${d.f}"]`);if(c)c.textContent=t.value.length+"/"+t.maxLength;upd();persist()}
 else if(d.l){S.links.find(x=>x.id===editId)[d.l]=t.value;if(d.l==="url"){const e2=$("#lerr");if(e2)e2.textContent=""}upd();persist()}
 else if(d.s){S.soc[d.s]=t.value.trim();upd();persist()}
 else if(d.p){PF[d.p]=t.value}});
document.addEventListener("change",async e=>{const t=e.target,u=t.dataset.up;if(!u||!t.files[0])return;
 try{const x=await up(await shrink(t.files[0],u==="wall"?1000:480));
  if(u==="prod"){PF.img=x;const i=document.querySelector('[data-p="img"]');if(i)i.value="yüklənmiş şəkil";return}
  if(u==="avatar")S.avatar=x;else if(u==="wall"){S.D.bs="image";S.D.img=x;push()}else if(u==="link")S.links.find(l=>l.id===editId).img=x;
  render();persist()}catch(err){toast("Şəkil yüklənmədi")}});
document.addEventListener("keydown",e=>{if(e.target.dataset&&e.target.dataset.q!==undefined&&e.key==="Enter"){const v=e.target.value.trim();if(v){const isU=v.includes(".");addLink(isU?host(v):v,isU?v:"")}}});
/* ---------- link və istifadəçi adı yoxlaması (sahədən çıxanda) ---------- */
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.l==="url"){const l=S.links.find(x=>x.id===editId);if(!l)return;const r=check(platOf(l),t.value);
  if(r.url){l.url=r.url;t.value=r.url}else l.url=t.value.trim();
  const e2=$("#lerr");if(e2)e2.textContent=r.err;upd();persist();return}
 if(t.dataset.un!==undefined){const v=cleanU(t.value),m=$("#unm");t.value=v;if(v===S.user)return;
  const bad=x=>{t.value=S.user;if(m)m.textContent=x};
  if(!/^[a-z0-9._-]{3,24}$/.test(v)||!/[a-z0-9]/.test(v))return bad("Ad 3-24 simvol olmalıdır: kiçik hərf, rəqəm, nöqtə, tire.");
  const q=await sb.rpc("username_taken",{u:v});if(q.error)return bad("Yoxlamaq alınmadı, yenidən cəhd et.");if(q.data)return bad("Bu ad artıq götürülüb.");
  const r=await sb.from("preorders").update({username:v}).eq("user_id",me.id);
  if(r.error)return bad(r.error.code==="23505"?"Bu ad artıq götürülüb.":"Dəyişmədi, yenidən cəhd et.");
  S.user=v;if(m)m.textContent="Dəyişdi ✓";upd()}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="ge")A.gsend();else if(e.target.id==="gc")A.gver()});

/* ---------- giriş (e-poçt kodu) və başlanğıc ---------- */
let GE="";
const gm=t=>{const e=$("#gm");if(e)e.textContent=t};
const HOME='<a class="lnkx" href="/">Pulsuz qeydiyyatdan keç</a>';
function gate(msg){$("#app").innerHTML=`<div class="gw"><h2>QısaGet${QL}</h2><p class="mu">E-poçtunu yaz, sənə 6 rəqəmli kod göndərək.</p><input id="ge" type="email" placeholder="ad@gmail.com" value="${esc(GE)}" autocapitalize="off"><button class="pill blk full" data-a="gsend">Kod göndər</button><p class="mu" id="gm">${esc(msg||"")}</p>${HOME}</div>`}
function gcode(){$("#app").innerHTML=`<div class="gw"><h2>Kodu yaz</h2><p class="mu">${esc(GE)} ünvanına göndərilən 6 rəqəmli kodu yaz.</p><input id="gc" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;font-size:24px;letter-spacing:6px"><button class="pill blk full" data-a="gver">Təsdiqlə</button><button class="pill full" data-a="gback">Geri</button><p class="mu" id="gm"></p></div>`}
function nogo(){$("#app").innerHTML=`<div class="gw"><h2>Qeydiyyat tapılmadı</h2><p class="mu">Bu hesab üçün ön sifariş qeydiyyatı yoxdur. Əvvəlcə qeydiyyatdan keç.</p>${HOME}<br><button class="pill full" data-a="out">Çıxış</button></div>`}
function nosb(){$("#app").innerHTML=`<div class="gw"><h2>QısaGet${QL}</h2><p class="mu">Supabase qoşulmayıb. public/js/config.js faylını doldur.</p></div>`}
Object.assign(A,{
 async gsend(){GE=$("#ge").value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(GE))return gm("Düzgün e-poçt yaz.");gm("Göndərilir…");
  const r=await sb.auth.signInWithOtp({email:GE,options:{shouldCreateUser:false}});
  if(r.error)return gm(/signups not allowed|not found/i.test(r.error.message)?"Bu e-poçtla qeydiyyat tapılmadı. Əvvəlcə qeydiyyatdan keç.":"Göndərilmədi: "+r.error.message);gcode()},
 async gver(){const r=await sb.auth.verifyOtp({email:GE,token:$("#gc").value.trim(),type:"email"});if(r.error)return gm("Kod səhvdir və ya vaxtı keçib.");boot()},
 gback(){gate()}
});
function seed(r){
 S.name=r.display_name||"";S.bio=r.bio||"";S.ts="text";S.soc={};S.links=[];S.prods=[];
 let id=Date.now();
 (r.links||[]).forEach(l=>{if(!l||!l.url)return;const k=l.extra?null:socFromUrl(l.title,l.url);
  if(k&&!S.soc[k[0]])S.soc[k[0]]=k[1];else S.links.push({id:id++,title:l.title||host(l.url),url:l.url,clicks:0,lay:"cls"})});
 const i=THMAP[r.theme]==null?0:THMAP[r.theme];S.D=Object.assign({},S.D,TH[i],{th:i});if(TH[i].gp>=0)S.D.bs="grad"}
async function seedAvatar(){let a="";try{a=localStorage.getItem("qs_av_"+me.id)||""}catch(e){}if(!a)return;
 try{S.avatar=await up(await (await fetch(a)).blob())}catch(e){S.avatar=a}
 try{localStorage.removeItem("qs_av_"+me.id)}catch(e){}render();persist()}
function hydrate(r){const p=r.profile||{};S.user=r.username;
 if(p.D){S.name=p.name||"";S.bio=p.bio||"";S.avatar=p.avatar||"";S.ts=p.ts||"text";S.soc=p.soc||{};S.links=p.links||[];S.prods=p.prods||[];S.D=Object.assign({},S.D,p.D)}
 else seed(r);
 SV=JSON.stringify(S.D);H=[SV];hi=0;return !!p.D}
const MIN_MS=2400; /* splash ən azı bu qədər millisaniyə görünür (səhifə açılandan etibarən) */
function endSplash(){const el=document.getElementById("qs-splash");if(!el||!el.isConnected)return;
 setTimeout(()=>{el.classList.add("out");setTimeout(()=>{el.remove();document.documentElement.classList.remove("qs-splash")},460)},Math.max(0,MIN_MS-performance.now()))}
setTimeout(endSplash,12000);
async function boot(){try{await boot0()}catch(e){try{gate("Xəta oldu: "+(e&&e.message||e))}catch(_){}}finally{endSplash()}}
async function boot0(){
 if(!sb)return nosb();
 const g=await sb.auth.getSession();if(!g.data.session)return gate();
 me=g.data.session.user;EMAIL=me.email||"";
 const r=await sb.from("preorders").select("*").eq("user_id",me.id).maybeSingle();
 if(r.error)return gate("Bazaya qoşulmaq alınmadı: "+r.error.message);
 if(!r.data)return nogo();
 if(r.data.theme==null){location.replace("/?signup=1");return}
 EMAIL=r.data.email||EMAIL;
 const had=hydrate(r.data);render();
 if(!had){persist();seedAvatar()}}
boot();
</script>
